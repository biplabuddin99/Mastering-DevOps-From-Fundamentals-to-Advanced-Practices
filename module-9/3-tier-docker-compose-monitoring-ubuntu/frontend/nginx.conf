server {
    listen 80;
    # server_name _ matches any Host header. In production behind a load balancer
    # or with a custom domain, replace _ with your actual domain name.
    server_name _;

    # Document root for static files compiled by Vite (copied into this image).
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------------
    # gzip reduces transfer size for text-based responses (JS, CSS, JSON, HTML).
    # gzip_vary: sends a Vary: Accept-Encoding header so CDNs cache both compressed
    # and uncompressed versions separately.
    # gzip_min_length 1024: do not compress responses smaller than 1 KB —
    # for tiny responses, compression overhead exceeds the size savings.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Limits the size of a request body (file uploads, large JSON payloads).
    # 10 MB is generous for a BMI tracker; lower this if uploads are not expected.
    client_max_body_size 10M;

    # ---------------------------------------------------------------------------
    # /health — Backend Health Probe (MUST be defined before /api)
    # ---------------------------------------------------------------------------
    # This location proxies GET /health through to the backend service.
    # It exists so that the CI/CD pipeline and external monitors can probe
    # the backend health via port 80 on the host (curl http://HOST/health)
    # without needing direct access to port 3000 (which is not host-published).
    #
    # Defined BEFORE /api because Nginx evaluates `location` blocks by specificity
    # (exact match > prefix match). Without this block, /health requests would
    # fall through to the /api block or to the SPA try_files fallback.
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_http_version 1.1;
        # Forward client identity headers so the backend can log the real requester.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Short timeout: health checks should respond in milliseconds.
        # A 10 s timeout surfaces backend slowness before it affects real traffic.
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------------
    # /api — Backend API Proxy
    # ---------------------------------------------------------------------------
    # All requests from the React SPA that start with /api are forwarded to the
    # Node.js backend. The backend hostname resolves via Docker's internal DNS
    # on bmi-frontend-network (the shared network between frontend and backend).
    #
    # This proxy eliminates CORS issues entirely: from the browser's perspective,
    # the API lives on the same origin (port 80) as the SPA.
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # Upgrade + Connection headers enable WebSocket proxying if the backend
        # ever adds WebSocket support. They are harmless for standard HTTP requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto tells the backend whether the original client request
        # arrived over HTTP or HTTPS (important for redirect URL generation).
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bypass Nginx proxy cache for WebSocket upgrade requests.
        proxy_cache_bypass $http_upgrade;
        # 60 s timeouts accommodate long-running calculations or slow DB queries.
        # Tune these down if API calls should never legitimately take this long.
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # / — SPA Static File Server with Client-Side Routing Fallback
    # ---------------------------------------------------------------------------
    # try_files attempts to serve the exact requested path ($uri), then a directory
    # index ($uri/), and finally falls back to /index.html.
    # The fallback is the key SPA pattern: React Router handles routing client-side,
    # so a direct navigation to /measurements/123 must return index.html (not 404).
    #
    # Cache-Control: no-cache on index.html forces the browser to revalidate on
    # every visit. This ensures users always load the latest deployed version
    # (hashed JS/CSS bundles referenced from index.html are cached separately below).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------------
    # Static Asset Caching
    # ---------------------------------------------------------------------------
    # Vite hashes asset filenames at build time (e.g. main.a1b2c3d4.js).
    # A hash change means a new URL — so old assets can be cached indefinitely.
    # `immutable` tells the browser never to revalidate; `public` allows CDN caching.
    # Together, these eliminate redundant asset requests for returning visitors.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # Security Headers (applied to all responses from this server block)
    # ---------------------------------------------------------------------------
    # X-Frame-Options: prevents clickjacking by blocking iframe embedding
    #   from third-party origins. SAMEORIGIN allows same-origin iframes (e.g. Grafana
    #   embedding a panel from the same host).
    add_header X-Frame-Options "SAMEORIGIN" always;
    # X-Content-Type-Options: prevents MIME-type sniffing. Browsers must honour
    #   the Content-Type header rather than guessing — mitigates content-injection attacks.
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection: legacy header enabling browser built-in XSS filter.
    #   Modern browsers rely on CSP instead, but this header protects older clients.
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------------------------------------------------------------------------
    # Error Handling
    # ---------------------------------------------------------------------------
    # 404s are handled by the SPA (React Router renders a not-found page).
    # Returning index.html with a 404 status is intentional: the browser loads
    # the SPA, React Router sees the unknown path, and renders its 404 component.
    error_page 404 /index.html;

    # 5xx upstream errors must NOT fall back to index.html.
    # If the backend is down and Nginx returns 200 + SPA HTML for an /api request,
    # monitoring health checks would incorrectly report the service as healthy
    # (HTTP 200 with HTML body looks like success to a naive health check).
    # The @upstream_error named location preserves the 502 status code and returns
    # a plain text body that monitoring tools can distinguish from real responses.
    error_page 500 502 503 504 @upstream_error;
    location @upstream_error {
        default_type text/plain;
        return 502 'Service temporarily unavailable';
    }
}
